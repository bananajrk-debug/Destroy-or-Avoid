<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destroy or Avoid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* タイトル画面オーバーレイ */
    #title-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 11, 22, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 20px;
    }
    h1 { font-size: 3rem; text-shadow: 0 0 20px #4d96ff; }
    .btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,77,77,0.4);
    }
    .btn:hover { background: #ff6666; }

    /* 中央上部タイマー */
    #timer-bar {
      position: absolute;
      top: 15px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffd93d;
      background: #1e1e2f;
      padding: 5px 25px;
      border-radius: 20px;
      border: 2px solid #33334d;
      z-index: 5;
    }

    canvas {
      background: #141422;
      border: 4px solid #33334d;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .instructions {
      margin-top: 10px;
      color: #888;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <h1>🚀 Destroy or Avoid</h1>
    <p style="color: #aaa; font-size: 1.1rem;">隕石衝突まで5分！仲間と協力してエンジンか羽を直せ！</p>
    <button class="btn" onclick="startGame()">ゲームスタート</button>
  </div>

  <!-- 中央上部の制限時間 -->
  <div id="timer-bar">残り時間: 05:00</div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div class="instructions">
    移動: [WASD] または [矢印キー] | アクション・タスク連打: [Space] キー
  </div>

  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const titleScreen = document.getElementById('title-screen');
    const timerBar = document.getElementById('timer-bar');

    let localState = null;
    let myPos = { x: 400, y: 300 };
    const keys = {};

    socket.on('stateUpdate', (state) => {
      localState = state;
      
      // タイトル画面の表示切り替え
      if (state.status === 'TITLE') {
        titleScreen.style.display = 'flex';
      } else {
        titleScreen.style.display = 'none';
      }

      // タイマー表示更新
      const mins = Math.floor(state.timer / 60).toString().padStart(2, '0');
      const secs = (state.timer % 60).toString().padStart(2, '0');
      timerBar.innerText = `残り時間: ${mins}:${secs}`;

      if (state.status === 'WIN') {
        timerBar.innerText = '🎉 ミッション成功！クリア！';
      } else if (state.status === 'LOSE') {
        timerBar.innerText = '💥 隕石が激突しました... (GAMEOVER)';
      }

      render();
    });

    function startGame() {
      socket.emit('startGame');
    }

    // キー入力監視
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') {
        socket.emit('action');
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    // 移動ループ
    setInterval(() => {
      if (!localState || localState.status !== 'PLAYING') return;
      const me = localState.players[socket.id];
      if (!me) return;

      const isHeavy = me.holdingItem === 'CORE';
      const speed = isHeavy ? 2.5 : 5;

      let moved = false;
      if (keys['ArrowUp'] || keys['w']) { myPos.y -= speed; moved = true; }
      if (keys['ArrowDown'] || keys['s']) { myPos.y += speed; moved = true; }
      if (keys['ArrowLeft'] || keys['a']) { myPos.x -= speed; moved = true; }
      if (keys['ArrowRight'] || keys['d']) { myPos.x += speed; moved = true; }

      if (moved) {
        socket.emit('move', myPos);
      } else {
        myPos.x = me.x;
        myPos.y = me.y;
      }
    }, 1000 / 30);

    // 描画処理
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!localState) return;

      // 1. エリアの描画
      // 作業台
      ctx.fillStyle = '#ffd93d';
      ctx.fillRect(340, 40, 120, 70);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('🛠 作業台 (要鉄くず3)', 342, 80);

      // エンジン修理 (DESTROY)
      ctx.fillStyle = '#ff4d4d';
      ctx.fillRect(80, 200, 140, 100);
      ctx.fillStyle = '#fff';
      ctx.fillText('⚙️ エンジン (Destroy)', 85, 245);

      // 羽修理 (AVOID)
      ctx.fillStyle = '#4d96ff';
      ctx.fillRect(580, 200, 140, 100);
      ctx.fillStyle = '#fff';
      ctx.fillText('🪽 羽 (Avoid)', 615, 245);

      // コア箱
      ctx.fillStyle = '#9c27b0';
      ctx.fillRect(60, 460, 90, 80);
      ctx.fillStyle = '#fff';
      ctx.fillText('📦 プラズマコア', 65, 505);

      // 2. マップ上の「鉄くず」描画
      localState.scraps.forEach(scrap => {
        if (scrap.active) {
          ctx.fillStyle = '#b0bec5';
          ctx.beginPath();
          ctx.arc(scrap.x, scrap.y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText('鉄', scrap.x - 5, scrap.y + 4);
        }
      });

      // 3. タスク進捗の表示 (画面下部)
      ctx.fillStyle = '#ffffff';
      ctx.font = '13px sans-serif';
      let dText = '【エンジン(Destroy)】 ';
      localState.tasks.destroy.forEach(t => {
        dText += `${t.name}(${t.clicks}/${t.maxClicks})${t.completed ? '✅ ' : '⬜ '}`;
      });
      ctx.fillText(dText, 30, 565);

      let aText = '【羽(Avoid)】 ';
      localState.tasks.avoid.forEach(t => {
        aText += `${t.name}(${t.clicks}/${t.maxClicks})${t.completed ? '✅ ' : '⬜ '}`;
      });
      ctx.fillText(aText, 30, 585);

      // 4. プレイヤーの描画
      Object.values(localState.players).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // 所持アイテム・鉄くず数の表示
        let info = '';
        if (p.scrapCount > 0) info += `鉄:${p.scrapCount}/3 `;
        if (p.holdingItem) info += `[${p.holdingItem}]`;
        if (info) {
          ctx.fillStyle = '#ffd93d';
          ctx.font = '12px sans-serif';
          ctx.fillText(info, p.x - 25, p.y - 25);
        }
      });
    }
  </script>
</body>
</html>
