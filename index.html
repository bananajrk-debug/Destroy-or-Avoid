<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destroy or Avoid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080b14;color:#e8ecf4;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 30%,#1b2a4a,#080b14);z-index:20;padding:20px;text-align:center}
h1{font-size:clamp(28px,6vw,56px);letter-spacing:.08em;color:#ff6b6b;text-shadow:0 0 24px rgba(255,80,80,.5)}
h1 span{color:#8ecbff}
.sub{opacity:.75;font-size:14px;max-width:560px;line-height:1.7}
input[type=text]{padding:12px 16px;font-size:18px;border-radius:10px;border:2px solid #3b4a6b;background:#10172a;color:#fff;text-align:center;width:260px;outline:none;user-select:text}
input[type=text]:focus{border-color:#8ecbff}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(#ff6b6b,#d63e3e);box-shadow:0 4px 0 #8f2323}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #8f2323}
button:disabled,button.cd{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
button.blue{background:linear-gradient(#4dabf7,#2b7fc9);box-shadow:0 4px 0 #1a4f80}
button.green{background:linear-gradient(#51cf66,#2f9e44);box-shadow:0 4px 0 #1d6b2d}
button.gray{background:linear-gradient(#6b7794,#48526e);box-shadow:0 4px 0 #2b3347}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(760px,95vw)}
.pcard{background:#12192b;border:2px solid #2b3856;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff3}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:#334;}
.tag.host{background:#ffd43b;color:#222}.tag.ready{background:#51cf66;color:#042}

/* ---- タイトル画面 ---- */
#title{justify-content:flex-start;padding-top:18px;gap:6px}
#title .sub{max-width:640px}
#avCv{height:min(46vh,430px);width:auto;aspect-ratio:360/430;flex:none;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55))}
#nameBox{display:flex;flex-direction:column;align-items:center;gap:10px}
#swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff3;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff9;transform:scale(1.15)}
#titleBtns{position:absolute;right:28px;bottom:28px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#titleBtns button{font-size:22px;padding:16px 34px;min-width:260px}
#titleKeys{position:absolute;left:24px;bottom:24px;text-align:left;font-size:12px;opacity:.6;line-height:1.8;max-width:42vw}
#titleErr{position:absolute;right:28px;bottom:196px;color:#ff8787;font-weight:700;font-size:15px;max-width:340px;text-align:right}
#joinPanel{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center}
#joinBox{background:#161d30;border:3px solid #4b5b83;border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(380px,92vw)}
#joinBox h3{font-size:22px}
#codeIn{font-size:42px;letter-spacing:.3em;width:100%;padding:10px 0 10px .3em;font-weight:800}
#joinErr{color:#ff8787;min-height:20px;font-size:14px;font-weight:700}

/* ---- ロビー ---- */
#roomCodeBox{display:flex;align-items:center;gap:14px;background:#10172a;border:2px solid #4b5b83;border-radius:14px;padding:8px 18px}
#roomCodeBox small{font-size:12px;opacity:.7}
#roomCode{font-size:44px;font-weight:900;letter-spacing:.22em;color:#ffd43b;text-shadow:0 0 14px #ffd43b66;user-select:text}
#roomCodeBox button{padding:8px 14px;font-size:14px}
#impBox{display:flex;align-items:center;gap:12px;background:#12192b;border:2px solid #2b3856;border-radius:14px;padding:10px 18px}
#impBox b{font-size:15px}
#impNum{font-size:30px;font-weight:900;color:#ff6b6b;min-width:34px}
#impBox button{padding:4px 16px;font-size:24px;line-height:1.2}
#impNote{font-size:12px;opacity:.7}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center}
#progWrap{position:relative;width:min(720px,58vw);height:48px;background:#0a0f1cdd;border:4px solid #fff;border-radius:99px;overflow:hidden;box-shadow:0 0 0 3px #000a,0 0 26px rgba(81,207,102,.5)}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#2f9e44,#51cf66 60%,#d8f5a2);transition:width .3s;box-shadow:inset 0 -9px 12px rgba(0,0,0,.22)}
.ptick{position:absolute;top:0;bottom:0;width:2px;background:#fff6}
#ptxt{position:absolute;inset:0;text-align:center;line-height:40px;font-size:24px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 4px #000,0 0 8px #000}
#timer{font-size:36px;font-weight:900;text-shadow:0 2px 8px #000;min-width:100px}
#tasks{position:absolute;top:84px;left:12px;background:#000a;border:1px solid #fff3;border-radius:12px;padding:10px 12px;min-width:240px;max-width:300px;font-size:14px;line-height:1.5}
#tasks h4{font-size:12px;opacity:.7;margin-bottom:4px}
.tk{padding:3px 0;border-top:1px solid #fff2}.tk:first-of-type{border-top:none}
.tk small{display:block;opacity:.65;font-size:11px}
#mm{position:absolute;top:84px;right:12px;border:2px solid #fff5;border-radius:8px;background:#000a;width:220px;height:139px}
#hint{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ffd43b;text-shadow:0 2px 6px #000;white-space:nowrap}
#slots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.slot{width:64px;height:64px;border-radius:12px;background:#000a;border:3px solid #fff3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative}
.slot.sel{border-color:#ffd43b;box-shadow:0 0 14px #ffd43b88}
.slot b{position:absolute;top:2px;left:6px;font-size:11px;opacity:.7}
.slot small{font-size:10px}
#btns{position:absolute;bottom:14px;right:14px;display:flex;gap:10px}
#btns button{padding:10px 16px;font-size:16px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:72px}
#btns small{font-size:10px;opacity:.8;font-weight:400}
#btns button.rdy{animation:pulse .8s infinite alternate}
@keyframes pulse{to{filter:brightness(1.4);transform:scale(1.06)}}
#roleTag{position:absolute;bottom:14px;left:14px;font-size:14px;padding:6px 12px;border-radius:99px;background:#000a;font-weight:700}
#spec{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:99px;font-size:14px}
#toast{position:fixed;top:150px;left:50%;transform:translateX(-50%);z-index:50;font-size:18px;font-weight:700;padding:8px 18px;border-radius:99px;background:#000c;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}#toast.error{color:#ff8787}#toast.good{color:#8ce99a}
#banner{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000b;pointer-events:none;animation:fade 3.2s forwards;text-align:center;padding:20px}
#banner h2{font-size:clamp(34px,8vw,80px)}#banner p{font-size:18px;opacity:.85;margin-top:8px}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}

/* ---- ミニゲーム ---- */
#mini{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center}
#miniBox{background:#161d30;border:3px solid #4b5b83;border-radius:18px;padding:18px 22px;text-align:center;width:min(580px,96vw)}
#miniTitle{font-size:22px;font-weight:800;margin-bottom:10px}
#miniHelp{font-size:13px;opacity:.75;margin-top:10px}
#miniBody canvas{background:#222733;border-radius:10px;max-width:100%}
.seqrow{display:flex;gap:10px;justify-content:center;margin:4px 0 18px;flex-wrap:nowrap}
.seqnum{width:62px;height:80px;border-radius:12px;background:#2b3552;border:4px solid #55658f;font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:.12s}
.seqnum.cur{border-color:#ffd43b;background:#4b4620;box-shadow:0 0 18px #ffd43b88;transform:translateY(-4px)}
.seqnum.done{border-color:#51cf66;background:#1f5a2f;color:#b8f5c2}
.seqrow.bad .seqnum{border-color:#fa5252;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center}
.keypad button{height:64px;font-size:30px;padding:0}
.keypad button.zero{grid-column:2}
.keyrow{display:flex;gap:24px;justify-content:center;margin:6px 0 16px}
.keycap{width:110px;height:110px;border-radius:18px;background:#2b3552;border:4px solid #55658f;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center}
.keycap.exp{border-color:#ffd43b;background:#4b4620;box-shadow:0 0 22px #ffd43b88}
.keycap.bad{border-color:#fa5252}
.bar{height:22px;background:#0a0e18;border-radius:99px;overflow:hidden;border:2px solid #4b5b83;margin:8px 0}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#4dabf7,#51cf66)}
.spbtn{width:100%;margin-top:6px}

/* ---- 会議 ---- */
#meeting{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 0,#22304f,#0a0f1c);display:flex;flex-direction:column;padding:14px;gap:10px}
#mHead{text-align:center}#mTitle{font-size:24px;font-weight:800;color:#ff8787}#mTimer{font-size:18px;opacity:.9}
#mMain{flex:1;display:flex;gap:12px;min-height:0}
#mRoster{flex:1.2;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.mcard{background:#141c30;border:2px solid #2b3856;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;position:relative}
.mcard.dead{opacity:.45}.mcard.my{border-color:#ffd43b}
.mcard .avatar{width:40px;height:40px;font-size:22px;flex:none}
.mcard .nm{flex:1;text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard button{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 #8f2323}
.mcard .cnt{font-weight:800;color:#ffd43b}
#mChat{flex:1;display:flex;flex-direction:column;background:#0d1324;border:2px solid #2b3856;border-radius:12px;min-width:0}
#chatLog{flex:1;overflow:auto;padding:10px;font-size:14px;line-height:1.6;user-select:text}
#chatLog div b{margin-right:6px}
#chatForm{display:flex;gap:6px;padding:8px}#chatIn{flex:1;width:auto;font-size:15px;text-align:left}
#chatForm button{padding:8px 16px;font-size:15px}
#mFoot{text-align:center;min-height:50px}
#mRes{font-size:22px;font-weight:800;color:#ffd43b;margin-top:6px}

/* ---- 結果 ---- */
#endscr{position:fixed;inset:0;z-index:35;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#endscr h2{font-size:clamp(34px,8vw,76px)}
#roster{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
@media(max-width:700px){#mMain{flex-direction:column}#tasks{min-width:0;max-width:56vw;font-size:12px}#mm{width:140px;height:88px}#timer{font-size:24px;min-width:70px}#ptxt{font-size:18px}#progWrap{height:40px}#titleBtns{left:16px;right:16px;bottom:16px}#titleBtns button{min-width:0}#titleKeys{display:none}#titleErr{right:16px;bottom:170px}.seqnum{width:46px;height:64px;font-size:32px}}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- タイトル -->
<div id="title" class="screen">
  <h1>DESTROY <span>or</span> AVOID</h1>
  <p class="sub">宇宙船を修理して脱出せよ。だが、仲間の中に<b style="color:#ff6b6b">インポスター</b>が紛れている…</p>
  <canvas id="avCv" width="360" height="430"></canvas>
  <div id="nameBox">
    <input type="text" id="nameIn" maxlength="10" placeholder="なまえ (10文字まで)">
    <div id="swatches"></div>
  </div>
  <div id="titleErr"></div>
  <div id="titleBtns">
    <button id="btnCreate" class="green">🚀 ロビーを作成</button>
    <button id="btnJoin" class="blue">🔑 ロビーに参加</button>
  </div>
  <div id="titleKeys">WASD:移動 / SPACE:使う・会議ボタン / R:報告 / E:キル / F:妨害<br>1-3:スロット選択 / Q:捨てる</div>
</div>

<div id="joinPanel" class="hidden">
  <div id="joinBox">
    <h3>ロビーに参加</h3>
    <p class="sub" style="font-size:13px">ホストから教えてもらった5桁の数字コードを入力</p>
    <input type="text" id="codeIn" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="12345">
    <div id="joinErr"></div>
    <div style="display:flex;gap:12px">
      <button id="btnJoinOk" class="blue">参加</button>
      <button id="btnJoinCancel" class="gray">キャンセル</button>
    </div>
  </div>
</div>

<!-- ロビー -->
<div id="lobby" class="screen hidden">
  <h1 style="font-size:clamp(24px,4vw,40px)">🚀 ロビー</h1>
  <div id="roomCodeBox">
    <div><small>ロビーコード</small><div id="roomCode">-----</div></div>
    <button id="btnCopy" class="gray">コピー</button>
  </div>
  <div id="lobbyMsg" class="sub"></div>
  <div id="impBox">
    <b>🔪 インポスター人数</b>
    <button id="impMinus" class="gray">−</button>
    <span id="impNum">1</span>
    <button id="impPlus" class="gray">＋</button>
  </div>
  <div id="impNote"></div>
  <div id="plist"></div>
  <div style="display:flex;gap:12px">
    <button id="btnLeave" class="gray">退出</button>
    <button id="btnReady" class="blue">準備OK</button>
    <button id="btnGo" class="green hidden">ゲーム開始</button>
  </div>
  <p class="sub" style="font-size:12px">ホストが全員の準備完了後にスタートすると、10分間のゲームが始まります (最低2人)</p>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="top">
    <div id="progWrap"><div id="pfill"></div><div class="ptick" style="left:25%"></div><div class="ptick" style="left:50%"></div><div class="ptick" style="left:75%"></div><div id="ptxt">0%</div></div>
    <div id="timer">10:00</div>
  </div>
  <div id="tasks"></div>
  <canvas id="mm" width="220" height="139"></canvas>
  <div id="hint"></div>
  <div id="slots"></div>
  <div id="btns">
    <button id="bUse" class="blue">使う<small>SPACE</small></button>
    <button id="bRep" class="green">報告<small>R</small></button>
    <button id="bSab" class="hidden">妨害<small>F</small></button>
    <button id="bKill" class="hidden">キル<small>E</small></button>
  </div>
  <div id="roleTag"></div>
  <div id="spec" class="hidden"></div>
</div>

<div id="mini" class="hidden"><div id="miniBox"><div id="miniTitle"></div><div id="miniBody"></div><div id="miniHelp"></div></div></div>

<div id="meeting" class="hidden">
  <div id="mHead"><div id="mTitle"></div><div id="mTimer"></div></div>
  <div id="mMain">
    <div id="mRoster"></div>
    <div id="mChat"><div id="chatLog"></div>
      <form id="chatForm"><input type="text" id="chatIn" maxlength="60" autocomplete="off" placeholder="発言する…"><button type="submit" class="blue">送信</button></form>
    </div>
  </div>
  <div id="mFoot"><button id="bSkip" class="blue hidden">スキップ (投票しない)</button><div id="mRes"></div></div>
</div>

<div id="endscr" class="hidden">
  <h2 id="endTitle"></h2><p id="endReason" class="sub" style="font-size:18px"></p>
  <div id="roster"></div>
  <button id="btnLobby" class="blue">ロビーへ戻る</button>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const socket = io();
const cv = $('cv'), ctx = cv.getContext('2d');
const mmc = $('mm'), mmx = mmc.getContext('2d');
const ITEM_ICON = { fuse: '🔌', battery: '🔋', core: '⚛️' };
const FALLBACK_COLORS = ['#ff6b6b', '#4dabf7', '#51cf66', '#ffd43b', '#cc5de8', '#ff922b', '#22b8cf', '#f783ac', '#a9e34b', '#c08457'];
let init = null, map = null, S = null, joined = false, mapCv = null, prevPh = '', roomCode = '';
let selSlot = 0, mini = null, meetSig = '', lastIn = '', taskSig = '', slotSig = '';
let myColor = FALLBACK_COLORS[1];
const TB = {}, ents = new Map(), keysDown = {};
const hyp = Math.hypot, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- 効果音 ----------
let ac = null;
function beep(f, d, type = 'square', v = .06, delay = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const SFX = {
  click: () => beep(520, .05),
  done: () => { beep(660, .1); beep(990, .15, 'square', .06, .1); },
  error: () => beep(160, .12),
  kill: () => { beep(140, .25, 'sawtooth', .1); beep(90, .3, 'sawtooth', .1, .1); },
  meeting: () => [660, 880, 660, 880].forEach((f, i) => beep(f, .15, 'square', .07, i * .18)),
  alarm: () => { beep(300, .2, 'sawtooth', .08); beep(240, .3, 'sawtooth', .08, .2); },
  start: () => [440, 554, 660].forEach((f, i) => beep(f, .2, 'triangle', .08, i * .15)),
  win: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, 'triangle', .08, i * .15)),
  lose: () => [400, 300, 220].forEach((f, i) => beep(f, .3, 'sawtooth', .07, i * .2)),
};
socket.on('sfx', n => SFX[n] && SFX[n]());

let toastT = 0;
function toast(text, kind) {
  const t = $('toast'); t.textContent = text; t.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2200);
  if (kind === 'error') SFX.error();
}
socket.on('toast', d => toast(d.text, d.kind));

// ---------- 初期化 / マップ受信 ----------
socket.on('init', d => {
  init = d;
  buildSwatches(d.COLORS || FALLBACK_COLORS);
});

// サーバーがルームごとに生成したランダム迷路を受け取ってオフスクリーンに描画
socket.on('map', d => {
  map = d;
  for (const k in TB) delete TB[k];
  d.TASKS.forEach(t => TB[t.id] = t);
  mapCv = document.createElement('canvas'); mapCv.width = d.W; mapCv.height = d.H;
  const g = mapCv.getContext('2d'), C = d.CELL;
  for (let r = 0; r < d.rows.length; r++) for (let c = 0; c < d.rows[r].length; c++) {
    if (d.rows[r][c] === '1') {
      g.fillStyle = '#2b3345'; g.fillRect(c * C, r * C, C, C);
      g.fillStyle = '#4a5572'; g.fillRect(c * C, r * C, C, 5);
      g.fillStyle = '#1c2231'; g.fillRect(c * C + 4, r * C + 9, C - 8, C - 15);
    } else {
      g.fillStyle = (r + c) % 2 ? '#1a2132' : '#1d2538'; g.fillRect(c * C, r * C, C, C);
    }
  }
  g.strokeStyle = 'rgba(255,90,90,.25)'; g.lineWidth = 4;
  g.beginPath(); g.arc(d.BUTTON.x, d.BUTTON.y, 110, 0, 7); g.stroke();
});

// ---------- アバター共通描画 ----------
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function el(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${((n >> 16) * k) | 0},${((n >> 8 & 255) * k) | 0},${((n & 255) * k) | 0})`; }

// 宇宙飛行士風の人型 (頭・胴体・腕・脚。歩行アニメ付き) — (0,0)が腰付近、足元は約y=+20
function drawAstroBody(g, e) {
  g.save();
  g.globalAlpha = e.a ? 1 : .45;
  g.fillStyle = 'rgba(0,0,0,.35)'; el(g, 0, 19, 14, 5); g.fill();
  g.scale(e.f || 1, 1);
  const sw = e.mv ? Math.sin(e.ph) * .75 : 0, dark = shade(e.c, .62), mid = shade(e.c, .82);
  const limb = (x, y, ang, col, len, glove) => {
    g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col; rr(g, -3.5, 0, 7, len, 3); g.fill();
    g.fillStyle = glove; rr(g, -4, len - 4, 8, 5, 2); g.fill(); g.restore();
  };
  g.fillStyle = '#c9ced6'; rr(g, -18, -14, 8, 20, 3); g.fill();               // 背負い装置
  if (e.a) { limb(-4, 8, sw, dark, 11, '#e9ecef'); limb(4, 8, -sw, mid, 11, '#e9ecef'); } // 脚
  limb(0, -9, -sw * 1.1, dark, 12, '#e9ecef');                                  // 奥の腕
  g.fillStyle = e.c; rr(g, -11, -15, 22, 24, 7); g.fill();                      // 胴体
  g.strokeStyle = dark; g.lineWidth = 2; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.25)'; rr(g, -7, -12, 5, 12, 3); g.fill();
  limb(0, -9, sw * 1.1, mid, 12, '#e9ecef');                                    // 手前の腕
  g.fillStyle = '#f1f3f5'; el(g, 2, -24, 12, 11); g.fill();                     // ヘルメット(頭)
  g.strokeStyle = '#9aa3b5'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#17324f'; el(g, 6, -24, 7.5, 5.5); g.fill();                   // バイザー
  g.fillStyle = 'rgba(255,255,255,.7)'; el(g, 8, -26, 2.8, 1.5); g.fill();
  g.restore();
}
function drawAstro(e, isMe) {
  ctx.save(); ctx.translate(e.x, e.y);
  drawAstroBody(ctx, e);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = e.a ? 1 : .6;
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#000b';
  ctx.fillStyle = (isMe && S.me.role === 'imposter') || e.i ? '#ff6b6b' : '#fff';
  ctx.strokeText(e.name, e.x, e.y - 42); ctx.fillText(e.name, e.x, e.y - 42); ctx.restore();
}
function drawBody(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; el(ctx, 0, 10, 24, 7); ctx.fill();
  ctx.fillStyle = b.c; rr(ctx, -14, -9, 30, 20, 9); ctx.fill(); ctx.strokeStyle = shade(b.c, .6); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#f1f3f5'; el(ctx, -18, 0, 10, 9); ctx.fill();
  ctx.strokeStyle = '#17324f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-23, -3); ctx.lineTo(-17, 3); ctx.moveTo(-17, -3); ctx.lineTo(-23, 3); ctx.stroke();
  ctx.fillStyle = '#fff'; rr(ctx, 10, -15, 4, 14, 2); ctx.fill(); el(ctx, 12, -16, 4, 3); ctx.fill();
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText('💀', 0, -22 + Math.sin(performance.now() / 300) * 3);
  ctx.restore();
}

const avCv = $('avCv'), avx = avCv.getContext('2d');
const avE = { x: 0, y: 0, ph: 0, mv: true, f: 1, a: true, c: myColor };
function drawTitleAvatar(dt) {

function onPhase(old, now) {
  const hide = (...ids) => ids.forEach(i => $(i).classList.add('hidden'));
  const show = (...ids) => ids.forEach(i => $(i).classList.remove('hidden'));
  if (now === 'lobby') { hide('hud', 'meeting', 'endscr', 'mini'); show('lobby'); mini = null; ents.clear(); renderLobby.sig = ''; return; }
  hide('lobby');
  show('hud');
  if (now === 'playing') {
    hide('meeting', 'endscr');
    if (old === 'lobby' && S.me.role) showBanner(S.me.role);
    if (old === 'meeting') meetSig = '';
  }
  if (now === 'meeting') { closeMini(); show('meeting'); $('chatLog').innerHTML = ''; meetSig = ''; $('mRes').textContent = ''; }
  if (now === 'end') { closeMini(); hide('meeting'); show('endscr'); }
  sendInput(true);
}
function showBanner(role) {
  const b = document.createElement('div'); b.id = 'banner';
  b.innerHTML = role === 'imposter'
    ? '<h2 style="color:#ff4d4d">あなたは インポスター</h2><p>正体を隠してクルーを排除しろ (E:キル / F:妨害)。タスクをこなすと全体の進捗も進む(偽装＋貢献)ので注意!</p>'
    : '<h2 style="color:#8ecbff">あなたは クルー</h2><p>タスクをこなして進捗100%を目指せ。インポスターを見抜け!</p>';
  document.body.appendChild(b); setTimeout(() => b.remove(), 3300);
}

socket.on('state', s => {
  if (!joined) return;
  S = s;
  if (s.ph !== prevPh) { const o = prevPh; prevPh = s.ph; onPhase(o, s.ph); }
  if (s.ph === 'lobby') { renderLobby(s); return; }
  if (!map) return;
  updateEnts(s); renderHud(s);
  if (s.ph === 'meeting') renderMeeting(s);
  if (s.ph === 'end') renderEnd(s);
});

function updateEnts(s) {
  const seen = new Set();
  for (const p of s.players) {
    seen.add(p.id);
    let e = ents.get(p.id);
    if (!e) { e = { x: p.x, y: p.y, ph: 0 }; ents.set(p.id, e); }
    if (hyp(p.x - e.x, p.y - e.y) > 160) { e.x = p.x; e.y = p.y; }
    Object.assign(e, { id: p.id, tx: p.x, ty: p.y, mv: p.mv, f: p.f, a: p.a, name: p.name, c: p.c, i: p.i });
  }
  for (const id of [...ents.keys()]) if (!seen.has(id)) ents.delete(id);
}
const myEnt = () => ents.get(init && init.you);

// ---------- HUD ----------
function nearHint(me, e) {
  if (!e || me.late) return { text: '', body: false, tgt: false };
  const body = me.alive && S.bodies.some(b => hyp(b.x - e.x, b.y - e.y) <= 110);
  let tgt = false;
  if (me.role === 'imposter') tgt = S.players.some(p => p.id !== init.you && p.a && !p.i && hyp(p.x - e.x, p.y - e.y) <= 95);
  let text = '';
  if (body) text = 'R: 死体を報告';
  else {
    for (const id of me.tasks) { const d = TB[id]; if (d && hyp(d.x - e.x, d.y - e.y) <= init.REACH) {
      text = d.kind === 'carry' ? (me.sl.includes(d.item) ? 'SPACE: 設置する' : `${init.ITEM_NAME[d.item]}が必要`) : `SPACE: ${d.name}`; break; } }
    if (!text) for (const id of me.tasks) { const d = TB[id]; if (!d || d.kind !== 'carry') continue; const st = map.STATIONS[d.item];
      if (hyp(st.x - e.x, st.y - e.y) <= init.REACH) { text = `SPACE: ${init.ITEM_NAME[d.item]}を取る`; break; } }
    if (!text && me.alive && hyp(map.BUTTON.x - e.x, map.BUTTON.y - e.y) <= 90) text = me.em ? '' : (me.emLock > 0 ? `会議ボタン (あと${Math.ceil(me.emLock / 1000)}秒)` : 'SPACE: 緊急会議ボタン');
  }
  return { text, body, tgt };
}

function renderHud(s) {
  const me = s.me, e = myEnt();
  $('pfill').style.width = s.prog + '%';
  $('ptxt').textContent = 'タスク進捗 ' + Math.floor(s.prog) + '%';
  const sec = Math.ceil(s.remain / 1000);
  $('timer').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  $('timer').style.color = sec < 60 ? '#ff6b6b' : '#fff';

  const tsig = me.tasks.join() + me.role + me.sl.join() + (map ? map.W : '');
  if (tsig !== taskSig) {
    taskSig = tsig;
    $('tasks').innerHTML = me.late ? '<h4>観戦中</h4>' : `<h4>${me.role === 'imposter' ? 'タスク (偽装 ＋ 進捗にも貢献)' : 'あなたのタスク'}</h4>` +
      me.tasks.map(id => { const d = TB[id]; if (!d) return '';
        const sub = d.kind === 'carry' ? (me.sl.includes(d.item) ? '持っている → 設置場所へ' : `${init.ITEM_NAME[d.item]}を取りに行く`) : ({ weld: '溶接 (A/D)', seq: '数字の並びを順番に入力', alt: 'K / O 交互連打', space: 'SPACE連打' })[d.kind];
        return `<div class="tk">${d.icon} ${d.name} <b style="color:#ffd43b">+${d.pct}%</b><small>${sub}</small></div>`; }).join('');
  }
  const ssig = me.sl.join() + selSlot;
  if (ssig !== slotSig) {
    slotSig = ssig;
    let html = '';
    for (let k = 0; k < init.SLOT_MAX; k++) {
      const t = me.sl[k];
      html += `<div class="slot ${k === selSlot ? 'sel' : ''}"><b>${k + 1}</b>${t ? ITEM_ICON[t] : ''}${t ? `<small>${init.ITEM_NAME[t].slice(0, 4)}</small>` : ''}</div>`;
    }
    $('slots').innerHTML = html;
  }
  const h = nearHint(me, e);
  $('hint').textContent = h.text;
  $('bRep').classList.toggle('rdy', h.body);
  $('bRep').classList.toggle('hidden', !me.alive || me.late);
  $('bUse').classList.toggle('hidden', me.late);
  const imp = me.role === 'imposter' && me.alive;
  $('bKill').classList.toggle('hidden', !imp); $('bSab').classList.toggle('hidden', !imp);
  if (imp) {
    $('bKill').classList.toggle('cd', me.kcd > 0);
    $('bKill').classList.toggle('rdy', me.kcd <= 0 && h.tgt);
    $('bKill').innerHTML = `キル<small>${me.kcd > 0 ? Math.ceil(me.kcd / 1000) + 's' : 'E'}</small>`;
    $('bSab').classList.toggle('cd', me.scd > 0);
    $('bSab').innerHTML = `妨害<small>${me.scd > 0 ? Math.ceil(me.scd / 1000) + 's' : 'F'}</small>`;
  }
  $('roleTag').textContent = me.late ? '' : me.role === 'imposter' ? '🔪 インポスター' : '🧑‍🚀 クルー' + (me.alive ? '' : ' (霊)');
  $('roleTag').style.color = me.role === 'imposter' ? '#ff6b6b' : '#8ecbff';
  $('spec').classList.toggle('hidden', !(me.late || !me.alive));
  $('spec').textContent = me.late ? '👀 ゲーム進行中のため観戦中 (次のロビーから参加)' : '👻 あなたは霊です — タスクは続けられます';
}

function renderMeeting(s) {
  const m = s.meet, me = s.me;
  $('mTitle').textContent = m.reason === 'body' ? `💀 死体発見! (報告者: ${m.caller})` : `🚨 緊急会議 (${m.caller})`;
  $('mTimer').textContent = ({ discuss: '議論タイム', vote: '投票タイム', result: '投票結果' })[m.mode] + `  ${Math.ceil(m.t / 1000)}s`;
  const canVote = m.mode === 'vote' && me.alive && !me.late && !m.my;
  const sig = m.mode + '|' + m.roster.map(r => r.id + r.a + r.voted).join() + (m.my || '') + (m.res ? 'r' : '');
  if (sig !== meetSig) {
    meetSig = sig;
    const tally = {}; if (m.res) m.res.tally.forEach(([id, n]) => tally[id] = n);
    $('mRoster').innerHTML = m.roster.map(r => `<div class="mcard ${r.a ? '' : 'dead'} ${m.my === r.id ? 'my' : ''}">${avatar(r.c)}<div class="nm">${esc(r.name)}${r.id === init.you ? ' (あなた)' : ''}${r.a ? '' : ' ☠'}</div>${r.voted && m.mode !== 'result' ? '✔' : ''}${m.res && tally[r.id] ? `<span class="cnt">${tally[r.id]}票</span>` : ''}${canVote && r.a ? `<button data-v="${r.id}">投票</button>` : ''}</div>`).join('');
    $('mRoster').querySelectorAll('button[data-v]').forEach(b => b.onclick = () => socket.emit('vote', b.dataset.v));
    if (m.res) {

      $('mRes').textContent = ej ? `${ej.name} が追放された… ${ej.imp ? 'インポスターだった!' : 'インポスターではなかった'}` : `誰も追放されなかった (スキップ ${m.res.skip}票)`;
    } else $('mRes').textContent = m.my ? `投票済み: ${m.my === 'skip' ? 'スキップ' : (m.roster.find(r => r.id === m.my) || {}).name}` : '';

  $('bSkip').classList.toggle('hidden', !canVote);

// 溶接: トーチは自動で降下、A/Dで線に合わせる (距離短め・速度ゆっくり)
const SEAM_AMP = 55, TORCH_DOWN = 36, TORCH_SIDE = 140, WELD_END = 304, SEAM_TOL = 24, OFF_LIMIT = 2.0;
const seamX = (y, ph) => 260 + Math.sin(y / 55 + ph) * SEAM_AMP;
function initWeld(body) {
  const c = document.createElement('canvas'); c.width = 520; c.height = 330; body.appendChild(c);
  $('miniHelp').textContent = 'A / D でトーチを左右に動かし、赤い線に合わせたまま下まで溶接 (Escで中止)';
  Object.assign(mini, { g: c.getContext('2d'), tx: 260, ty: 24, ph: Math.random() * 6, off: 0, trail: [] });
}
function updateWeld(dt) {
  const m = mini, g = m.g;
  const dir = ((keysDown.d || keysDown.arrowright) ? 1 : 0) - ((keysDown.a || keysDown.arrowleft) ? 1 : 0);
  m.tx = clamp(m.tx + dir * TORCH_SIDE * dt, 20, 500); m.ty += TORCH_DOWN * dt;
  const ok = Math.abs(m.tx - seamX(m.ty, m.ph)) <= SEAM_TOL;
  if (!ok) m.off += dt;
  m.trail.push([m.tx, m.ty, ok]);
  g.fillStyle = '#2a303d'; g.fillRect(0, 0, 520, 330);
  g.fillStyle = '#343c4d'; g.fillRect(0, 0, 260 - 2, 330); g.fillRect(262, 0, 258, 330);
  g.strokeStyle = '#ff5a3c'; g.lineWidth = 5; g.setLineDash([10, 6]); g.beginPath();
  for (let y = 24; y <= WELD_END; y += 4) { const x = seamX(y, m.ph); y === 24 ? g.moveTo(x, y) : g.lineTo(x, y); }
  g.stroke(); g.setLineDash([]);
  for (const [x, y, k] of m.trail) { g.fillStyle = k ? '#ffd166' : '#6b6f78'; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
  g.fillStyle = '#9aa3b5'; g.fillRect(m.tx - 8, m.ty - 30, 16, 22);
  g.fillStyle = ok ? '#ffa94d' : '#ff6b6b'; g.beginPath(); g.moveTo(m.tx - 6, m.ty - 8); g.lineTo(m.tx + 6, m.ty - 8); g.lineTo(m.tx, m.ty + 6); g.fill();
  g.fillStyle = '#0008'; g.fillRect(10, 306, 500, 14);
  g.fillStyle = m.off > OFF_LIMIT * .7 ? '#fa5252' : '#fcc419'; g.fillRect(10, 306, 500 * clamp(m.off / OFF_LIMIT, 0, 1), 14);
  g.fillStyle = '#fff'; g.font = '11px sans-serif'; g.fillText('ズレ許容', 14, 317);
  if (m.off >= OFF_LIMIT) finishMini(false);
  else if (m.ty >= WELD_END) finishMini(true);
}

// 数字の順番入力: サーバーが毎回ランダムに選んだ5〜6個の数字を横に並べ、その順番通りに入力
function initSeq(body, seq) {
  Object.assign(mini, { seq, idx: 0 });
  const row = document.createElement('div'); row.className = 'seqrow'; row.id = 'seqRow';
  seq.forEach((v, i) => { const d = document.createElement('div'); d.className = 'seqnum' + (i === 0 ? ' cur' : ''); d.textContent = v; row.appendChild(d); });
  body.appendChild(row);
  const pad = document.createElement('div'); pad.className = 'keypad';
  [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].forEach(v => {
    const b = document.createElement('button'); b.textContent = v; if (v === 0) b.className = 'zero';
    b.onclick = () => { seqPress(v); b.blur(); };
    pad.appendChild(b);
  });
  body.appendChild(pad);
  $('miniHelp').textContent = `上の ${seq.length} 個の数字を左から順番に入力 (数字キーも使えます / 間違えると最初から / Escで中止)`;
}
function seqUi() {
  const m = mini; if (!m) return;
  [...$('seqRow').children].forEach((d, i) => {
    d.classList.toggle('done', i < m.idx);
    d.classList.toggle('cur', i === m.idx);
  });
}
function seqPress(v) {
  const m = mini; if (!m || m.kind !== 'seq' || m.idx >= m.seq.length) return;
  if (v === m.seq[m.idx]) {
    m.idx++; SFX.click(); seqUi();
    if (m.idx >= m.seq.length) later(m, () => finishMini(true), 250);
  } else {
    SFX.error(); m.idx = 0;
    const row = $('seqRow'); row.classList.remove('bad'); void row.offsetWidth; row.classList.add('bad');
    setTimeout(() => row.classList.remove('bad'), 320);
    seqUi();
  }
}

// K / O 交互連打
function initAlt(body, n) {
  Object.assign(mini, { n, cnt: 0, exp: 'k' });
  body.innerHTML = '<div class="keyrow"><div class="keycap exp" id="kK">K</div><div class="keycap" id="kO">O</div></div><div class="bar"><div id="altFill"></div></div><div id="altTxt"></div>';
  $('miniHelp').textContent = 'K と O を交互に押そう (長押し無効 / Escで中止)';
  altUi();
}
function altUi() {
  const m = mini; $('kK').classList.toggle('exp', m.exp === 'k'); $('kO').classList.toggle('exp', m.exp === 'o');
  $('altFill').style.width = (m.cnt / m.n * 100) + '%'; $('altTxt').textContent = `${m.cnt} / ${m.n}`;
}
function altKey(k) {
  const m = mini; if (!m || m.kind !== 'alt' || (k !== 'k' && k !== 'o')) return;
  if (k === m.exp) { m.cnt++; m.exp = k === 'k' ? 'o' : 'k'; beep(400 + m.cnt * 12, .04); altUi(); if (m.cnt >= m.n) later(m, () => finishMini(true), 200); }
  else { const el2 = $(k === 'k' ? 'kK' : 'kO'); el2.classList.add('bad'); setTimeout(() => el2.classList.remove('bad'), 150); }
}

// SPACE連打 (1回ずつ)
function initSpace(body, n) {
  Object.assign(mini, { n, cnt: 0 });
  body.innerHTML = '<div class="bar"><div id="spFill"></div></div><div id="spTxt" style="font-size:20px;font-weight:800"></div><button class="spbtn blue" id="spBtn">SPACE を押す!</button>';
  $('spBtn').onclick = () => { spacePress(); $('spBtn').blur(); };
  $('miniHelp').textContent = `SPACE を ${n} 回、1回ずつ押そう (長押し無効 / Escで中止)`;
  spaceUi();
}
function spaceUi() { $('spFill').style.width = (mini.cnt / mini.n * 100) + '%'; $('spTxt').textContent = `${mini.cnt} / ${mini.n}`; }
function spacePress() {
  const m = mini; if (!m || m.kind !== 'space') return;
  m.cnt++; beep(300 + m.cnt * 40, .05); spaceUi();
  if (m.cnt >= m.n) later(m, () => finishMini(true), 200);
}
function miniKey(e, k) {
  if (e.repeat) return;
  if (mini.kind === 'seq' && /^[0-9]$/.test(k)) seqPress(+k);
  else if (mini.kind === 'alt') altKey(k);
  else if (mini.kind === 'space' && k === ' ') spacePress();
}

// ---------- 入力 ----------
function sendInput(force) {
  const blocked = mini || !S || S.ph !== 'playing';
  const o = blocked ? { up: 0, down: 0, left: 0, right: 0 } : {
    up: !!(keysDown.w || keysDown.arrowup), down: !!(keysDown.s || keysDown.arrowdown),
    left: !!(keysDown.a || keysDown.arrowleft), right: !!(keysDown.d || keysDown.arrowright) };
  const j = JSON.stringify(o);
  if (force || j !== lastIn) { lastIn = j; socket.emit('input', o); }
}
const GAMEKEYS = [' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
addEventListener('keydown', e => {
  if (!joined || !S) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keysDown[k] = true;
  if (mini) { e.preventDefault(); if (k === 'escape') cancelMini(); else miniKey(e, k); return; }
  if (S.ph !== 'playing') return;
  if (GAMEKEYS.includes(k)) e.preventDefault();
  if (!e.repeat) {
    if (k === ' ') socket.emit('action');
    else if (k === 'r') socket.emit('report');
    else if (k === 'e') socket.emit('kill');
    else if (k === 'f') socket.emit('sabotage');
    else if (k === 'q') socket.emit('discard', selSlot);
    else if (k === '1' || k === '2' || k === '3') selSlot = +k - 1;
  }
  sendInput();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase(); keysDown[k] = false;
  if (k === ' ' && joined) e.preventDefault();
  sendInput();
});
addEventListener('blur', () => { for (const k in keysDown) keysDown[k] = false; sendInput(); });

// ---------- 描画 ----------
function drawGame(dt) {
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  if (S.ph === 'meeting') return;
  for (const e of ents.values()) {
    e.x += (e.tx - e.x) * Math.min(1, dt * 18); e.y += (e.ty - e.y) * Math.min(1, dt * 18);
    if (e.mv) e.ph += dt * 13; else e.ph = 0;
  }
  const me = S.me, mine = myEnt();
  const cam = mine || [...ents.values()][0] || { x: map.W / 2, y: map.H / 2 };
  const sc = Math.max(1.5, h / 430);                    // 高ズーム
  ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.translate(w / 2, h / 2); ctx.scale(sc, sc); ctx.translate(-cam.x, -cam.y);
  // 巨大マップなので、画面に見えている範囲だけ転送する
  const vw = w / sc, vh = h / sc;
  const x0 = Math.max(0, cam.x - vw / 2), y0 = Math.max(0, cam.y - vh / 2);
  const x1 = Math.min(map.W, cam.x + vw / 2), y1 = Math.min(map.H, cam.y + vh / 2);
  if (x1 > x0 && y1 > y0) ctx.drawImage(mapCv, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pulse = 1 + Math.sin(performance.now() / 250) * .12;
  // 供給所
  for (const it of ['fuse', 'battery', 'core']) {
    const p = map.STATIONS[it], need = me.tasks.some(id => TB[id] && TB[id].item === it);
    ctx.fillStyle = need ? '#3a3f1f' : '#252b3a'; rr(ctx, p.x - 22, p.y - 22, 44, 44, 8); ctx.fill();
    ctx.strokeStyle = need ? '#ffd43b' : '#4a5572'; ctx.lineWidth = need ? 3 : 2; ctx.stroke();
    ctx.font = '24px serif'; ctx.fillStyle = '#fff'; ctx.fillText(ITEM_ICON[it], p.x, p.y);
    ctx.font = '10px sans-serif'; ctx.fillText(init.ITEM_NAME[it] + '箱', p.x, p.y + 32);
  }
  // 緊急会議ボタン
  const B = map.BUTTON;
  ctx.fillStyle = '#4a1f1f'; el(ctx, B.x, B.y, 30, 22); ctx.fill();
  ctx.fillStyle = '#ff3b3b'; el(ctx, B.x, B.y - 4, 22, 15); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('EMERGENCY', B.x, B.y - 4);
  // タスク拠点
  for (const d of map.TASKS) {
    const act = !me.late && me.tasks.includes(d.id);
    if (!act && !me.late && me.alive) { ctx.globalAlpha = .18; ctx.font = '20px serif'; ctx.fillStyle = '#fff'; ctx.fillText(d.icon, d.x, d.y); ctx.globalAlpha = 1; continue; }
    if (act) {
      ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(d.x, d.y, 26 * pulse, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,212,59,.15)'; ctx.fill();
    }
    ctx.font = `${act ? 28 : 20}px serif`; ctx.fillStyle = '#fff'; ctx.fillText(d.icon, d.x, d.y);
  }
  for (const b of S.bodies) drawBody(b);
  [...ents.values()].sort((a, b) => a.y - b.y).forEach(e => drawAstro(e, e.id === init.you));
  ctx.restore();
  // 視界 (生存者は周囲のみ)
  if (me.alive && !me.late) {
    const g = ctx.createRadialGradient(w / 2, h / 2, 190 * sc * .8, w / 2, h / 2, 330 * sc);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.93)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  // ミニマップ
  const MW = mmc.width, MH = mmc.height;
  mmx.clearRect(0, 0, MW, MH);
  mmx.drawImage(mapCv, 0, 0, MW, MH);
  const kx = MW / map.W, ky = MH / map.H;
  if (!me.late) for (const id of me.tasks) { const d = TB[id]; if (!d) continue; mmx.fillStyle = '#ffd43b'; mmx.beginPath(); mmx.arc(d.x * kx, d.y * ky, 3.5, 0, 7); mmx.fill(); }
  mmx.fillStyle = '#ff3b3b'; mmx.fillRect(B.x * kx - 2, B.y * ky - 2, 4, 4);
  for (const b of S.bodies) { mmx.fillStyle = '#f33'; mmx.fillRect(b.x * kx - 3, b.y * ky - 3, 6, 6); }
  if (mine) { mmx.fillStyle = '#fff'; mmx.beginPath(); mmx.arc(mine.x * kx, mine.y * ky, 3.5, 0, 7); mmx.fill(); }
}

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (!joined) { ctx.clearRect(0, 0, cv.width, cv.height); drawTitleAvatar(dt); }
  else if (S && S.ph !== 'lobby' && init && map) drawGame(dt);
  else ctx.clearRect(0, 0, cv.width, cv.height);
  if (mini && mini.kind === 'weld') updateWeld(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
