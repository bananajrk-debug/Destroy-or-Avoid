<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destroy or Avoid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080b14;color:#e8ecf4;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;background:radial-gradient(circle at 50% 40%,#1b2a4a,#080b14);z-index:20;padding:16px 16px 110px;text-align:center;overflow-y:auto;overflow-x:hidden}
h1{font-size:clamp(22px,4.2vw,42px);letter-spacing:.08em;color:#ff6b6b;text-shadow:0 0 24px rgba(255,80,80,.5);flex:none}
h1 span{color:#8ecbff}
.sub{opacity:.75;font-size:13px;max-width:560px;line-height:1.6;flex:none}
input[type=text]{padding:9px 14px;font-size:17px;border-radius:10px;border:2px solid #3b4a6b;background:#10172a;color:#fff;text-align:center;width:240px;outline:none;user-select:text;flex:none}
input[type=text]:focus{border-color:#8ecbff}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 26px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(#ff6b6b,#d63e3e);box-shadow:0 4px 0 #8f2323}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #8f2323}
button:disabled,button.cd{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
button.blue{background:linear-gradient(#4dabf7,#2b7fc9);box-shadow:0 4px 0 #1a4f80}
button.green{background:linear-gradient(#51cf66,#2f9e44);box-shadow:0 4px 0 #1d6b2d}
#pv{width:min(220px,42vw);max-height:38vh;height:auto;display:block;flex:none;filter:drop-shadow(0 10px 24px #0008)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:min(540px,92vw);flex:none}
.chip{width:38px;height:38px;border-radius:10px;padding:0;font-size:20px;background:#12192b;border:2px solid #2b3856;box-shadow:none;display:flex;align-items:center;justify-content:center}
.chip.sel{border-color:#ffd43b;box-shadow:0 0 12px #ffd43b88}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:3px solid #fff3;box-shadow:none}
.sw.sel{border-color:#fff}
#titleBtns{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:row;gap:12px;z-index:21;padding:10px 14px;background:rgba(8,11,20,.78);border-radius:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 24px #000a}
#titleBtns button{font-size:18px;padding:12px 22px;min-width:160px}
@media(max-height:620px){#pv{width:min(170px,34vw);max-height:30vh}.chip{width:34px;height:34px;font-size:18px}.sw{width:26px;height:26px}h1{font-size:clamp(20px,3.6vw,32px)}}
#joinModal{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center}
#joinBox{background:#161d30;border:3px solid #4b5b83;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
#codeIn{font-size:38px;letter-spacing:.35em;width:300px;padding-left:.35em}
#joinErr{color:#ff8787;min-height:20px;font-size:14px}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:min(760px,95vw)}
.pcard{background:#12192b;border:2px solid #2b3856;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #fff3;position:relative}
.avatar i{position:absolute;top:-14px;font-style:normal;font-size:20px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:#334}
.tag.host{background:#ffd43b;color:#222}.tag.ready{background:#51cf66;color:#042}
#codeBox{font-size:clamp(40px,9vw,84px);font-weight:900;letter-spacing:.25em;padding-left:.25em;color:#ffd43b;text-shadow:0 0 20px #ffd43b66}
#impBox{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:700;background:#12192b;border:2px solid #2b3856;padding:8px 16px;border-radius:14px}
#impBox button{padding:4px 14px;font-size:20px;box-shadow:0 3px 0 #8f2323}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center}
#progWrap{position:relative;width:min(700px,60vw);height:40px;background:#000b;border:4px solid #fff;border-radius:99px;overflow:hidden;box-shadow:0 0 22px #51cf66aa,0 4px 14px #000}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#2f9e44,#51cf66 60%,#d8f5a2);transition:width .35s;box-shadow:0 0 14px #a9e34b inset}
#ptxt{position:absolute;inset:0;text-align:center;line-height:32px;font-size:20px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 4px #000,0 0 8px #000}
#timer{font-size:32px;font-weight:900;text-shadow:0 2px 6px #000;min-width:96px}
#tasks{position:absolute;top:64px;left:12px;background:#000a;border:1px solid #fff3;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55;max-width:250px}
#tasks h4{font-size:11px;opacity:.7;margin-bottom:2px}
.tk b{color:#ffd43b;margin-left:4px}.tk small{opacity:.6;margin-left:4px;font-size:11px}
#mm{position:absolute;top:64px;right:12px;border:2px solid #fff5;border-radius:8px;background:#000a;width:200px;height:125px}
#hint{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ffd43b;text-shadow:0 2px 6px #000;white-space:nowrap}
#itemHud{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000a;border:3px solid #ffd43b;border-radius:14px;padding:6px 16px;font-size:26px;display:flex;align-items:center;gap:8px;min-width:80px;justify-content:center}
#itemHud.empty{border-color:#fff3;opacity:.5}
#mapOverlay{position:fixed;inset:0;z-index:15;background:#000c;display:flex;align-items:center;justify-content:center}
#mapOverlay canvas{max-width:min(900px,95vw);max-height:90vh;border:3px solid #4b5b83;border-radius:10px}
#mapOverlay .mapClose{position:absolute;top:16px;right:20px;font-size:28px;cursor:pointer;color:#fff;background:#000a;border:none;border-radius:50%;width:44px;height:44px}
#btns{position:absolute;bottom:14px;right:14px;display:flex;gap:10px}
#btns button{padding:10px 16px;font-size:16px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:72px}
#btns small{font-size:10px;opacity:.8;font-weight:400}
#btns button.rdy{animation:pulse .8s infinite alternate}
@keyframes pulse{to{filter:brightness(1.4);transform:scale(1.06)}}
#roleTag{position:absolute;bottom:14px;left:14px;font-size:14px;padding:6px 12px;border-radius:99px;background:#000a;font-weight:700}
#spec{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:99px;font-size:14px}
#toast{position:fixed;top:112px;left:50%;transform:translateX(-50%);z-index:50;font-size:18px;font-weight:700;padding:8px 18px;border-radius:99px;background:#000c;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}#toast.error{color:#ff8787}#toast.good{color:#8ce99a}
#mini{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center}
#miniBox{background:#161d30;border:3px solid #4b5b83;border-radius:18px;padding:18px 22px;text-align:center;width:min(580px,96vw)}
#miniTitle{font-size:22px;font-weight:800;margin-bottom:10px}
#miniHelp{font-size:13px;opacity:.75;margin-top:10px}
#miniBody canvas{background:#222733;border-radius:10px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center}
.grid button{height:66px;font-size:30px;padding:0}
.grid button.bad{background:#fa5252}
.seqrow{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.sq{width:56px;height:68px;border-radius:10px;background:#0e1424;border:3px solid #4b5b83;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center}
.sq.cur{border-color:#ffd43b;box-shadow:0 0 14px #ffd43b88}
.sq.ok{background:#2f9e44;border-color:#8ce99a}
.sq.bad{background:#fa5252}
.keyrow{display:flex;gap:24px;justify-content:center;margin:6px 0 16px}
.keycap{width:110px;height:110px;border-radius:18px;background:#2b3552;border:4px solid #55658f;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center}
.keycap.exp{border-color:#ffd43b;background:#4b4620;box-shadow:0 0 22px #ffd43b88}
.keycap.bad{border-color:#fa5252}
.bar{height:22px;background:#0a0e18;border-radius:99px;overflow:hidden;border:2px solid #4b5b83;margin:8px 0}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#4dabf7,#51cf66)}
.spbtn{width:100%;margin-top:6px}
#meeting{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 0,#22304f,#0a0f1c);display:flex;flex-direction:column;padding:14px;gap:10px}
#mHead{text-align:center}#mTitle{font-size:24px;font-weight:800;color:#ff8787}#mTimer{font-size:18px;opacity:.9}
#mMain{flex:1;display:flex;gap:12px;min-height:0}
#mRoster{flex:1.2;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.mcard{background:#141c30;border:2px solid #2b3856;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px}
.mcard.dead{opacity:.45}.mcard.my{border-color:#ffd43b}
.mcard .avatar{width:40px;height:40px;font-size:22px;flex:none}
.mcard .nm{flex:1;text-align:left;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard button{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 #8f2323}
.mcard .cnt{font-weight:800;color:#ffd43b}
#mChat{flex:1;display:flex;flex-direction:column;background:#0d1324;border:2px solid #2b3856;border-radius:12px;min-width:0}
#chatLog{flex:1;overflow:auto;padding:10px;font-size:14px;line-height:1.6;user-select:text}
#chatLog div b{margin-right:6px}
#chatForm{display:flex;gap:6px;padding:8px}#chatIn{flex:1;width:auto;font-size:15px;text-align:left}
#chatForm button{padding:8px 16px;font-size:15px}
#mFoot{text-align:center;min-height:50px}
#mRes{font-size:22px;font-weight:800;color:#ffd43b;margin-top:6px}
#endscr{position:fixed;inset:0;z-index:35;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#endscr h2{font-size:clamp(34px,8vw,76px)}
#roster{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
@media(max-width:700px){#tasks{max-width:56vw;font-size:12px}#mm{width:130px;height:81px}#mMain{flex-direction:column}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="fx" class="hidden"></canvas>

<div id="title" class="screen">
  <h1>DESTROY <span>or</span> AVOID</h1>
  <canvas id="pv" width="340" height="420"></canvas>
  <input type="text" id="nameIn" maxlength="10" placeholder="なまえ (10文字まで)">
  <div class="row" id="accRow"></div>
  <div class="row" id="colRow"></div>
  <p class="sub" style="font-size:12px">WASD:移動 / SPACE:使う・会議ボタン / R:報告 / E:キル / F:妨害 / M:マップ表示</p>
</div>
<div id="titleBtns">
  <button id="bCreate" class="green">ロビーを作成</button>
  <button id="bJoin" class="blue">ロビーに参加</button>
</div>
<div id="joinModal" class="hidden"><div id="joinBox">
  <h2>ロビーに参加</h2><p class="sub">5桁の数字コードを入力</p>
  <input type="text" id="codeIn" maxlength="5" inputmode="numeric" placeholder="00000" autocomplete="off">
  <div id="joinErr"></div>
  <div style="display:flex;gap:10px"><button id="bJoinGo" class="green">参加する</button><button id="bJoinCancel" class="blue">もどる</button></div>
</div></div>

<div id="lobby" class="screen hidden">
  <div class="sub">ルームコード (友達に教えよう)</div>
  <div id="codeBox">-----</div>
  <div id="lobbyMsg" class="sub"></div>
  <div id="plist"></div>
  <div id="impBox"><span>🔪 インポスター人数</span><button id="impDn">−</button><span id="impN">1</span><span>人</span><button id="impUp">＋</button></div>
  <div style="display:flex;gap:12px">
    <button id="btnReady" class="blue">準備OK</button>
    <button id="btnGo" class="green hidden">ゲーム開始</button>
    <button id="btnLeave" style="background:#555;box-shadow:0 4px 0 #333">退出</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="top"><div id="progWrap"><div id="pfill"></div><div id="ptxt">0%</div></div><div id="timer">10:00</div></div>
  <div id="tasks"></div>
  <canvas id="mm" width="200" height="125"></canvas>
  <div id="hint"></div>
  <div id="itemHud" class="empty"></div>
  <div id="btns">
    <button id="bUse" class="blue">使う<small>SPACE</small></button>
    <button id="bRep" class="green">報告<small>R</small></button>
    <button id="bSab" class="hidden">妨害<small>F</small></button>
    <button id="bKill" class="hidden">キル<small>E</small></button>
  </div>
  <div id="roleTag"></div><div id="spec" class="hidden"></div>
</div>

<div id="mini" class="hidden"><div id="miniBox"><div id="miniTitle"></div><div id="miniBody"></div><div id="miniHelp"></div><button id="miniX" style="margin-top:12px;padding:8px 20px;font-size:15px;background:#555;box-shadow:0 4px 0 #333">✕ 中止 (Esc)</button></div></div>

<div id="meeting" class="hidden">
  <div id="mHead"><div id="mTitle"></div><div id="mTimer"></div></div>
  <div id="mMain"><div id="mRoster"></div>
    <div id="mChat"><div id="chatLog"></div>
      <form id="chatForm"><input type="text" id="chatIn" maxlength="60" autocomplete="off" placeholder="発言する…"><button type="submit" class="blue">送信</button></form></div></div>
  <div id="mFoot"><button id="bSkip" class="blue hidden">スキップ (投票しない)</button><div id="mRes"></div></div>
</div>

<div id="mapOverlay" class="hidden"><canvas id="mapBig"></canvas><button class="mapClose" id="mapCloseBtn">✕</button></div>
<div id="endscr" class="hidden"><h2 id="endTitle"></h2><p id="endReason" class="sub" style="font-size:18px"></p><div id="roster"></div><button id="btnLobby" class="blue">ロビーへ戻る</button></div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const socket = io();
const cv = $('cv'), ctx = cv.getContext('2d');
const fxc = $('fx'), fxg = fxc.getContext('2d');
const mmx = $('mm').getContext('2d');
const pvc = $('pv'), pvg = pvc.getContext('2d');
const ITEM_ICON = { fuse: '🔌', battery: '🔋', core: '⚛️' };
let init = null, S = null, MAP = null, mapCv = null, joined = false, prevPh = '', prevMode = '';
let mini = null, meetSig = '', lastIn = '', taskSig = '', itemSig = '', fx = null, mapOpen = false;
let myAcc = '', myColor = '#4dabf7';
const TB = {}, ents = new Map(), keysDown = {};
const hyp = Math.hypot, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function resize() { cv.width = innerWidth; cv.height = innerHeight; fxc.width = innerWidth; fxc.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- 効果音 ----------
let ac = null;
function beep(f, d, type = 'square', v = .06, delay = 0) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
}
const SFX = {
  click: () => beep(520, .05), done: () => { beep(660, .1); beep(990, .15, 'square', .06, .1); }, error: () => beep(160, .12),
  kill: () => { beep(140, .25, 'sawtooth', .1); beep(90, .3, 'sawtooth', .1, .1); },
  meeting: () => [660, 880, 660, 880].forEach((f, i) => beep(f, .15, 'square', .07, i * .18)),
  alarm: () => { beep(300, .2, 'sawtooth', .08); beep(240, .3, 'sawtooth', .08, .2); },
  start: () => [440, 554, 660].forEach((f, i) => beep(f, .2, 'triangle', .08, i * .15)),
  win: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, 'triangle', .08, i * .15)),
  lose: () => [400, 300, 220].forEach((f, i) => beep(f, .3, 'sawtooth', .07, i * .2)),
};
socket.on('sfx', n => SFX[n] && SFX[n]());
let toastT = 0;
function toast(text, kind) {
  const t = $('toast'); t.textContent = text; t.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2200); if (kind === 'error') SFX.error();
}
socket.on('toast', d => toast(d.text, d.kind));

// ---------- 人型アバター (頭・胴体・腕・脚・アクセサリー) ----------
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${((n >> 16) * k) | 0},${((n >> 8 & 255) * k) | 0},${((n & 255) * k) | 0})`; }
function rrg(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function elg(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); }
function drawAstro(g, e, s, nameCol) {
  s = s || 1;
  g.save(); g.translate(e.x, e.y); if (e.rot) g.rotate(e.rot); g.scale(s, s);
  g.globalAlpha = e.a === false ? .45 : 1;
  if (!e.rot) { g.fillStyle = 'rgba(0,0,0,.35)'; elg(g, 0, 19, 14, 5); g.fill(); }
  g.save(); g.scale(e.f || 1, 1);
  const sw = e.mv ? Math.sin(e.ph) * .75 : 0, dark = shade(e.c, .62), mid = shade(e.c, .82);
  const limb = (x, y, ang, col, len) => { g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col; rrg(g, -3.5, 0, 7, len, 3); g.fill(); g.fillStyle = '#e9ecef'; rrg(g, -4, len - 4, 8, 5, 2); g.fill(); g.restore(); };
  g.fillStyle = '#c9ced6'; rrg(g, -18, -14, 8, 20, 3); g.fill();
  if (e.a !== false) { limb(-4, 8, sw, dark, 11); limb(4, 8, -sw, mid, 11); }
  limb(0, -9, -sw * 1.1, dark, 12);
  g.fillStyle = e.c; rrg(g, -11, -15, 22, 24, 7); g.fill(); g.strokeStyle = dark; g.lineWidth = 2; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.25)'; rrg(g, -7, -12, 5, 12, 3); g.fill();
  limb(0, -9, sw * 1.1, mid, 12);
  g.fillStyle = '#f1f3f5'; elg(g, 2, -24, 12, 11); g.fill(); g.strokeStyle = '#9aa3b5'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#17324f'; elg(g, 6, -24, 7.5, 5.5); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; elg(g, 8, -26, 2.8, 1.5); g.fill();
  g.restore();
  if (e.acc) { g.font = '19px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e.acc, 2 * (e.f || 1), -37 + (e.mv ? Math.abs(Math.sin(e.ph)) * -1.5 : 0)); }
  if (nameCol && e.name && !e.rot) {
    g.font = 'bold 12px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineWidth = 3; g.strokeStyle = '#000b';
    g.strokeText(e.name, 0, -50); g.fillStyle = nameCol; g.fillText(e.name, 0, -50);
  }
  g.restore();
}

// ---------- タイトル ----------
try { $('nameIn').value = localStorage.getItem('doa_name') || ''; myAcc = localStorage.getItem('doa_acc') || ''; myColor = localStorage.getItem('doa_col') || myColor; } catch (e) {}
function buildTitleUi() {
  $('accRow').innerHTML = init.ACCS.map(a => `<button class="chip ${a === myAcc ? 'sel' : ''}" data-a="${a}">${a || '<small>なし</small>'}</button>`).join('');
  $('accRow').querySelectorAll('button').forEach(b => b.onclick = () => { myAcc = b.dataset.a; buildTitleUi(); SFX.click(); });

function onPhase(old, now) {
  const hide = (...ids) => ids.forEach(i => $(i).classList.add('hidden')), show = (...ids) => ids.forEach(i => $(i).classList.remove('hidden'));
  if (now === 'lobby') { hide('hud', 'meeting', 'endscr', 'mini'); show('lobby'); mini = null; ents.clear(); renderLobby.sig = ''; fx = null; fxc.classList.add('hidden'); return; }
  hide('lobby'); show('hud'); if (now !== 'meeting') releaseFocus();
  if (now === 'playing') {
    hide('meeting', 'endscr'); if (old === 'meeting') meetSig = '';
    if (old === 'lobby' && S.me.role) startFx('role', { role: S.me.role, mates: S.me.mates, ic: S.ic, players: S.players.map(p => ({ ...p })) }, 3400);
  }
  if (now === 'meeting') { closeMini(); show('meeting'); $('chatLog').innerHTML = ''; meetSig = ''; $('mRes').textContent = ''; prevMode = ''; }
  if (now === 'end') { closeMini(); hide('meeting'); show('endscr'); }
  sendInput(true);
}
socket.on('state', s => {
  if (!joined) return;
  S = s;
  if (s.ph !== prevPh) { const o = prevPh; prevPh = s.ph; onPhase(o, s.ph); }
  if (s.ph === 'lobby') { renderLobby(s); return; }
  updateEnts(s); renderHud(s);
  if (s.ph === 'meeting') renderMeeting(s);
  if (s.ph === 'end') renderEnd(s);
});
function updateEnts(s) {
  const seen = new Set();
  for (const p of s.players) {
    seen.add(p.id); let e = ents.get(p.id);
    if (!e) { e = { x: p.x, y: p.y, ph: 0 }; ents.set(p.id, e); }
    if (hyp(p.x - e.x, p.y - e.y) > 160) { e.x = p.x; e.y = p.y; }
    Object.assign(e, { id: p.id, tx: p.x, ty: p.y, mv: p.mv, f: p.f, a: p.a, name: p.name, c: p.c, acc: p.acc, item: p.item || null });
  }
  for (const id of [...ents.keys()]) if (!seen.has(id)) ents.delete(id);
}
const myEnt = () => ents.get(init && init.you);

function nearHint(me, e) {

  const body = me.alive && S.bodies.some(b => hyp(b.x - e.x, b.y - e.y) <= 110);
  const tgt = me.role === 'imposter' && S.players.some(p => p.id !== init.you && p.a && !me.mates.includes(p.id) && hyp(p.x - e.x, p.y - e.y) <= 95);

addEventListener('blur', clearKeys);

// ---------- 描画 ----------
function drawMachine(d, act, t) {

  ctx.fillStyle = '#202738'; rrg(ctx, d.x - 20, d.y - 18, 40, 36, 6); ctx.fill(); ctx.strokeStyle = act ? '#ffd43b' : '#566'; ctx.lineWidth = act ? 3 : 2; ctx.stroke();

  const on = (Math.floor(t / 420) + d.id) % 2;

  ctx.fillStyle = '#f1f3f5'; elg(ctx, -18, 0, 10, 9); ctx.fill();
  ctx.strokeStyle = '#17324f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-23, -3); ctx.lineTo(-17, 3); ctx.moveTo(-17, -3); ctx.lineTo(-23, 3); ctx.stroke();
  ctx.fillStyle = '#fff'; rrg(ctx, 10, -15, 4, 14, 2); ctx.fill(); elg(ctx, 12, -16, 4, 3); ctx.fill();
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText('💀', 0, -22 + Math.sin(performance.now() / 300) * 3); ctx.restore();

function drawGame(dt, now) {

  }
  const B = MAP.BUTTON;
  ctx.fillStyle = '#4a1f1f'; elg(ctx, B.x, B.y, 30, 22); ctx.fill(); ctx.fillStyle = '#ff3b3b'; elg(ctx, B.x, B.y - 4, 22, 15); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('EMERGENCY', B.x, B.y - 4);
  for (const d of init.TASKS) {
    const act = !me.late && me.tasks.includes(d.id);
    if (act) { ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(d.x, d.y, 30 * pulse, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(255,212,59,.15)'; ctx.fill(); }

    drawAstro(ctx, e, 1, e.id === init.you ? (me.role === 'imposter' ? '#ff6b6b' : '#ffe066') : (me.mates.includes(e.id) ? '#ff6b6b' : '#fff'));
    if (e.item) { ctx.save(); ctx.font = '18px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(ITEM_ICON[e.item], e.x, e.y - 38); ctx.restore(); }
